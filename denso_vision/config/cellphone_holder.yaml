cellphone_holder_detector:
  ros__parameters:
    image_source: realsense
    target: rgb  # rgb or captcha; unchecked English Google test widget
    captcha_min_side_mm: 3.0
    captcha_max_side_mm: 9.0
    captcha_match_threshold: 0.72
    image_topic: /basic_camera
    video_path: ''
    video_loop: true
    video_fps: 0.0
    realsense_frame_id: camera_color_optical_frame
    realsense_serial: ''
    realsense_width: 1280
    realsense_height: 720
    realsense_fps: 30
    # Meter the bright phone screen instead of the dark room. Exposure and
    # gain caps prevent the screen from saturating while keeping tags visible.
    realsense_auto_exposure: true
    realsense_auto_exposure_limit_us: 12000.0
    realsense_auto_gain_limit: 32.0
    realsense_screen_exposure_roi: true
    # If the initial layout is still invalid, try these real shutter values
    # until a valid layout is found, then retain the successful exposure.
    realsense_exposure_recovery: true
    realsense_exposure_recovery_us: [8000.0, 16000.0, 24000.0, 30000.0, 38000.0, 45000.0]
    realsense_exposure_recovery_delay_sec: 2.0
    # Used only when realsense_auto_exposure is false.
    realsense_exposure_us: 8000.0
    realsense_gain: 16.0
    # Rectify direct pyrealsense2 colour frames from their active SDK
    # intrinsics before tag and coloured-circle detection.
    undistort_realsense_color: true
    holder_frame_id: right_cellphone_holder_tags_frame
    tag_ids: [1, 2, 3, 4]
    # Expected tag-centre order in the camera image, row by row. The holder
    # rotates +90 deg counterclockwise when phone_orientation=horizontal.
    phone_orientation: vertical
    vertical_image_tag_order: [1, 2, 4, 3]
    horizontal_image_tag_order: [2, 3, 1, 4]
    tag_size_mm: 21.5
    top_spacing_mm: 95.2
    bottom_spacing_mm: 99.8
    side_spacing_mm: 207.5
    target_pixel_x: -1.0
    target_pixel_y: -1.0
    homography_ransac_threshold_mm: 4.0
    # Local contrast recovery keeps dark paper tags detectable while exposure
    # is metered on the bright phone screen.
    tag_clahe_clip_limit: 2.0
    tag_clahe_grid_size: 8
    stable_frames: 3
    stable_tolerance_px: 3.0
    min_dot_radius_px: 6.0
    max_dot_radius_px: 150.0
    min_dot_circularity: 0.75
    # Used only when the normal HSV/circularity pass is not a valid RGB batch.
    # The relaxed result must still contain equal, nonoverlapping RGB trios.
    low_light_value_min: 40
    low_light_min_dot_circularity: 0.5
    # Values measured from the D405 frame: the red dot is orange (H=13)
    # and the blue dot is cyan (H=89).
    red_hsv_0: [0, 60, 180]
    red_hsv_1: [18, 255, 255]
    red_hsv_2: [170, 60, 180]
    red_hsv_3: [179, 255, 255]
    green_hsv_0: [45, 50, 160]
    green_hsv_1: [85, 255, 255]
    blue_hsv_0: [86, 80, 160]
    blue_hsv_1: [130, 255, 255]
    # Gazebo lighting renders the same targets much darker than the D405.
    # These ranges are selected automatically only when sim=true.
    sim_red_hsv_0: [0, 60, 30]
    sim_red_hsv_1: [18, 255, 255]
    sim_red_hsv_2: [170, 60, 30]
    sim_red_hsv_3: [179, 255, 255]
    sim_green_hsv_0: [45, 50, 30]
    sim_green_hsv_1: [85, 255, 255]
    sim_blue_hsv_0: [86, 80, 30]
    sim_blue_hsv_1: [130, 255, 255]
    # Holder-plane bounds exclude the tags and the phone's top controls.
    target_roi_x_min_mm: -50.0
    target_roi_x_max_mm: 50.0
    target_roi_y_min_mm: -100.0
    target_roi_y_max_mm: 85.0
    target_diagnostic_dir: /tmp/denso_target_diagnostics
    publish_debug_image: true
    # The magenta dot in /debug_image is this link projected through the
    # inverse image-to-holder-plane homography.
    debug_tip_link: left_calib_link
