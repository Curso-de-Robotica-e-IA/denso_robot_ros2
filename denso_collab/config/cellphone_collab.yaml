move_to_screen_standoff:
  ros__parameters:
    holder_frame: right_cellphone_holder_tags_frame
    target_link: left_camera_depth_optical_frame
    tool_link: left_calib_link
    observation_distance_m: 0.30
    align_before_each_target: true

random_collab_pose:
  ros__parameters:
    planning_mode: dual_arm  # dual_arm or sequential
    max_holder_offset_x_m: 0.05
    max_holder_offset_y_m: 0.05
    max_holder_offset_z_m: 0.03
    max_holder_tilt_x_deg: 45.0
    max_holder_tilt_y_deg: 45.0
    max_candidate_attempts: 20
    validation_planning_timeout_sec: 2.0
    camera_observation_distance_m: 0.25
