controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz

    denso_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    left_denso_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    right_denso_joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController


left_denso_joint_trajectory_controller:
  ros__parameters:
    joints:
      - left_joint_1
      - left_joint_2
      - left_joint_3
      - left_joint_4
      - left_joint_5
      - left_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 1000.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0

right_denso_joint_trajectory_controller:
  ros__parameters:
    joints:
      - right_joint_1
      - right_joint_2
      - right_joint_3
      - right_joint_4
      - right_joint_5
      - right_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 1000.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.0
      goal_time: 0.0